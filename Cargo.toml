[package]
name = "ani-search"
version = "0.1.0"
edition = "2024"

[dependencies]
curl = "0.4.50"
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = "0.35.0"
json = "0.12.4"
reqwest = {version = "0.13.4", features=["default", "__native-tls", "http2"]}
serde = {version = "1.0.228", features =["derive"]}
serde_derive = "1.0.228"
serde_json = "1.0.150"
tokio = {version = "1.0", features=["full"]}
