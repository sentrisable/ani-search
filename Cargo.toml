[package]
name = "ani-search"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.1"
base64 = "0.22.1"
ctr = "0.10.1"
curl = "0.4.50"
eframe = "0.35.0"
egui = "0.35.0"
